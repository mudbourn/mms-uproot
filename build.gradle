plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

// A probe run plays in a world of its own, made fresh with a fixed seed: reusing one run's save would carry that run's chunks and edits into the next.
def probeWorld = "uproot_probe_" + new Date().format('yyyyMMdd_HHmmss')

loom {
	accessWidenerPath = file("src/main/resources/mms_uproot.accesswidener")
	mods {
		"mms_uproot" {
			sourceSet sourceSets.main
		}
	}
	runs {
		// a dedicated server on its own mods folder (run-server/mods), for a mod run in isolation from the shared run/mods: runUprootServer
		uprootServer {
			server()
			ideConfigGenerated false
			runDir "run-server"
		}
		// a client on its own mods folder (run-client/mods) that loads a singleplayer world: runUprootClient
		uprootClient {
			client()
			ideConfigGenerated false
			runDir "run-client"
			programArg "--quickPlaySingleplayer"
			programArg "uproot_client"
		}
		// the dev client the probe harness drives (info.mudbourn.mmsuproot.probe); run it through the uprootProbe task
		uprootProbe {
			client()
			ideConfigGenerated false
			runDir "run"
			vmArg "-Duproot.probe=true"
			vmArg "-Duproot.probe.world=${probeWorld}"
			programArg "--quickPlaySingleplayer"
			programArg probeWorld
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Loader checks mod dependencies before any mod code runs, so the overrides for the mods in run/mods must exist before launch.
tasks.register('uprootOverrides', JavaExec) {
	group = 'uproot'
	description = 'Writes run/config/fabric_loader_dependencies.json for the mods in run/mods'
	def mods = file('run/mods')
	def out = file('run/config/fabric_loader_dependencies.json')
	classpath = sourceSets.main.output
	mainClass = 'info.mudbourn.mmsuproot.tool.OverridesTool'
	args mods.path, out.path
	inputs.dir(mods).optional()
	outputs.file(out)
	onlyIf { mods.isDirectory() }
}

// The same for the dedicated server on its own mods folder.
tasks.register('uprootServerOverrides', JavaExec) {
	group = 'uproot'
	description = 'Writes run-server/config/fabric_loader_dependencies.json for the mods in run-server/mods'
	def mods = file('run-server/mods')
	def out = file('run-server/config/fabric_loader_dependencies.json')
	classpath = sourceSets.main.output
	mainClass = 'info.mudbourn.mmsuproot.tool.OverridesTool'
	args mods.path, out.path
	inputs.dir(mods).optional()
	outputs.file(out)
	onlyIf { mods.isDirectory() }
}

tasks.matching { it.name == 'runUprootServer' }.configureEach {
	dependsOn 'uprootServerOverrides'
}

// The same for the client on its own mods folder.
tasks.register('uprootClientOverrides', JavaExec) {
	group = 'uproot'
	description = 'Writes run-client/config/fabric_loader_dependencies.json for the mods in run-client/mods'
	def mods = file('run-client/mods')
	def out = file('run-client/config/fabric_loader_dependencies.json')
	classpath = sourceSets.main.output
	mainClass = 'info.mudbourn.mmsuproot.tool.OverridesTool'
	args mods.path, out.path
	inputs.dir(mods).optional()
	outputs.file(out)
	onlyIf { mods.isDirectory() }
}

// The classes 1.21.1 renderers are pointed at live in mms-render-common (client/legacy); the client run loads its jar from run-client/mods.
def renderCommonProps = new Properties()
file('../mms-render-common/gradle.properties').withInputStream { renderCommonProps.load(it) }

tasks.register('renderCommonJar', Exec) {
	group = 'uproot'
	description = 'Builds the jar of the sibling mms-render-common'
	workingDir file('../mms-render-common')
	commandLine './gradlew', 'jar', '--console=plain', '-q'
}

tasks.register('uprootClientMods', Copy) {
	group = 'uproot'
	description = 'Copies the mms-render-common jar into run-client/mods'
	dependsOn 'renderCommonJar'
	from(fileTree('../mms-render-common/build/libs')) {
		include "mms-render-common-${renderCommonProps.getProperty('mod_version')}.jar"
	}
	into 'run-client/mods'
}

tasks.matching { it.name == 'uprootClientOverrides' }.configureEach {
	dependsOn 'uprootClientMods'
}

tasks.matching { it.name == 'runUprootClient' }.configureEach {
	dependsOn 'uprootClientOverrides'
	// Keep the client from taking focus: a background app is never activated, so the window opens behind whatever the user is working in.
	environment 'SDL_WINDOW_ACTIVATE_WHEN_SHOWN', '0'
	environment 'SDL_WINDOW_ACTIVATE_WHEN_RAISED', '0'
	environment 'SDL_MAC_BACKGROUND_APP', '1'
}

// Offline gap scan: lists what the mods in run/mods (and any jar or folder in -PscanMods, comma separated) still reference that 26.3 lacks.
tasks.register('uprootScan', JavaExec) {
	group = 'uproot'
	description = 'Writes build/uproot-scan/gaps.md and gaps.json, the references the target mods make that 26.3 lacks, without launching the game'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'info.mudbourn.mmsuproot.tool.ScanTool'
	maxHeapSize = '3g'
	def extra = providers.gradleProperty('scanMods').getOrElse('').split(',').collect { it.trim() }.findAll { !it.isEmpty() }
	def scanOut = providers.gradleProperty('scanOut').getOrElse('build/uproot-scan')
	// Two jars with one mod id: the scan judges the native 26.3 build, as the game loads it; -PscanPrefer=legacy keeps the old jar instead.
	def scanPrefer = providers.gradleProperty('scanPrefer').getOrElse('')
	if (!scanPrefer.isEmpty()) systemProperty 'uproot.scan.prefer', scanPrefer
	args = ['--out', file(scanOut).path, '--cache', file('run/mms-uproot/cache').path, file('run/mods').path] + extra
}

// Offline intersection heat: every point where two or more mods of a pack touch the same thing, scored by fragility.
// Reads -PintersectMods (default: the test instance's mods folder; *.jar.disabled beside the jars are the pre-update versions).
tasks.register('uprootIntersect', JavaExec) {
	group = 'uproot'
	description = 'Writes build/uproot-intersect/intersections.json and intersections.md: where mods touch the same code or content, scored, without launching the game'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'info.mudbourn.mmsuproot.tool.IntersectTool'
	maxHeapSize = '4g'
	def modsDir = providers.gradleProperty('intersectMods').getOrElse('/Volumes/道具/PrismLauncher/instances/MMS 26.3 Test/minecraft/mods')
	def intersectOut = providers.gradleProperty('intersectOut').getOrElse('build/uproot-intersect')
	def maxNodes = providers.gradleProperty('intersectMaxNodes').getOrElse('30000')
	args = ['--out', file(intersectOut).path, '--cache', file('run/mms-uproot/cache').path, '--max-nodes', maxNodes, modsDir]
}

tasks.matching { it.name == 'runClient' || it.name == 'runServer' }.configureEach {
	dependsOn 'uprootOverrides'
}

// Runs the in-game probes in the test world and fails when any probe fails or the run did not finish.
def probeFile = file('run/mms-uproot/probe.txt')
tasks.matching { it.name == 'runUprootProbe' }.configureEach {
	dependsOn 'uprootOverrides'
	// Keep the probe client from taking focus: SDL reads these hints from the environment. A background app gets no
	// Dock icon and is never activated, so the window opens behind whatever the user is working in.
	environment 'SDL_WINDOW_ACTIVATE_WHEN_SHOWN', '0'
	environment 'SDL_WINDOW_ACTIVATE_WHEN_RAISED', '0'
	environment 'SDL_MAC_BACKGROUND_APP', '1'
	timeout = java.time.Duration.ofMinutes(15)
	doFirst { probeFile.delete() }
}

tasks.register('uprootProbe') {
	group = 'uproot'
	description = 'Launches the dev client with the probe harness, waits for it to quit and fails on any probe failure'
	dependsOn 'runUprootProbe'
	doLast {
		if (!probeFile.isFile()) throw new GradleException("uprootProbe: ${probeFile} is missing, the game did not get as far as running probes")
		def lines = probeFile.readLines('UTF-8').findAll { it.startsWith('PROBE ') }
		def plan = lines.find { it.startsWith('PROBE PLAN ') }
		def done = lines.find { it.startsWith('PROBE DONE ') }
		def results = lines.findAll { it ==~ /PROBE (PASS|FAIL|SKIP) .*/ }
		def failed = results.findAll { it.startsWith('PROBE FAIL ') }
		results.each { logger.lifecycle(it) }
		if (plan == null) throw new GradleException("uprootProbe: ${probeFile} has no PROBE PLAN line")
		int expected = (plan - 'PROBE PLAN ').trim() as int
		if (!failed.isEmpty()) throw new GradleException("uprootProbe: ${failed.size()} probe(s) failed:\n" + failed.join('\n'))
		if (done == null) {
			def last = results.isEmpty() ? '(none)' : results.last()
			throw new GradleException("uprootProbe: the run did not finish (no PROBE DONE line; ${results.size()} of ${expected} probes reported, last: ${last}); the game probably crashed")
		}
		if (results.size() != expected) throw new GradleException("uprootProbe: ${results.size()} probe results for a plan of ${expected}")
		logger.lifecycle("uprootProbe: ${done - 'PROBE '}")
	}
}
