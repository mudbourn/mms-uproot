plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	accessWidenerPath = file("src/main/resources/mms_uproot.accesswidener")
	mods {
		"mms_uproot" {
			sourceSet sourceSets.main
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Loader checks mod dependencies before any mod code runs, so the overrides for the mods in run/mods must exist before launch.
tasks.register('uprootOverrides', JavaExec) {
	group = 'uproot'
	description = 'Writes run/config/fabric_loader_dependencies.json for the mods in run/mods'
	def mods = file('run/mods')
	def out = file('run/config/fabric_loader_dependencies.json')
	classpath = sourceSets.main.output
	mainClass = 'info.mudbourn.mmsuproot.tool.OverridesTool'
	args mods.path, out.path
	inputs.dir(mods).optional()
	outputs.file(out)
	onlyIf { mods.isDirectory() }
}

tasks.matching { it.name == 'runClient' }.configureEach {
	dependsOn 'uprootOverrides'
}
