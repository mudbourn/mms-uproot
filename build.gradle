plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	accessWidenerPath = file("src/main/resources/mms_uproot.accesswidener")
	mods {
		"mms_uproot" {
			sourceSet sourceSets.main
		}
	}
	runs {
		// the dev client the probe harness drives (info.mudbourn.mmsuproot.probe); run it through the uprootProbe task
		uprootProbe {
			client()
			ideConfigGenerated false
			runDir "run"
			vmArg "-Duproot.probe=true"
			programArg "--quickPlaySingleplayer"
			programArg "uproot_check"
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

// Loader checks mod dependencies before any mod code runs, so the overrides for the mods in run/mods must exist before launch.
tasks.register('uprootOverrides', JavaExec) {
	group = 'uproot'
	description = 'Writes run/config/fabric_loader_dependencies.json for the mods in run/mods'
	def mods = file('run/mods')
	def out = file('run/config/fabric_loader_dependencies.json')
	classpath = sourceSets.main.output
	mainClass = 'info.mudbourn.mmsuproot.tool.OverridesTool'
	args mods.path, out.path
	inputs.dir(mods).optional()
	outputs.file(out)
	onlyIf { mods.isDirectory() }
}

tasks.matching { it.name == 'runClient' }.configureEach {
	dependsOn 'uprootOverrides'
}

// Runs the in-game probes in the test world and fails when any probe fails or the run did not finish.
def probeFile = file('run/mms-uproot/probe.txt')
tasks.matching { it.name == 'runUprootProbe' }.configureEach {
	dependsOn 'uprootOverrides'
	timeout = java.time.Duration.ofMinutes(5)
	doFirst { probeFile.delete() }
}

tasks.register('uprootProbe') {
	group = 'uproot'
	description = 'Launches the dev client with the probe harness, waits for it to quit and fails on any probe failure'
	dependsOn 'runUprootProbe'
	doLast {
		if (!probeFile.isFile()) throw new GradleException("uprootProbe: ${probeFile} is missing, the game did not get as far as running probes")
		def lines = probeFile.readLines('UTF-8').findAll { it.startsWith('PROBE ') }
		def plan = lines.find { it.startsWith('PROBE PLAN ') }
		def done = lines.find { it.startsWith('PROBE DONE ') }
		def results = lines.findAll { it ==~ /PROBE (PASS|FAIL|SKIP) .*/ }
		def failed = results.findAll { it.startsWith('PROBE FAIL ') }
		results.each { logger.lifecycle(it) }
		if (plan == null) throw new GradleException("uprootProbe: ${probeFile} has no PROBE PLAN line")
		int expected = (plan - 'PROBE PLAN ').trim() as int
		if (!failed.isEmpty()) throw new GradleException("uprootProbe: ${failed.size()} probe(s) failed:\n" + failed.join('\n'))
		if (done == null) {
			def last = results.isEmpty() ? '(none)' : results.last()
			throw new GradleException("uprootProbe: the run did not finish (no PROBE DONE line; ${results.size()} of ${expected} probes reported, last: ${last}); the game probably crashed")
		}
		if (results.size() != expected) throw new GradleException("uprootProbe: ${results.size()} probe results for a plan of ${expected}")
		logger.lifecycle("uprootProbe: ${done - 'PROBE '}")
	}
}
